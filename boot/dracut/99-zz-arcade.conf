# Sorted after Bazzite's 99-nvidia.conf so these assignments override it.
# nvidia (and its ~100MB firmware) loads from the root fs instead: plymouth runs on simpledrm meanwhile,
# and GRUB has far less to read.
force_drivers=" vfio vfio_iommu_type1 vfio-pci "
omit_drivers+=" nvidia nvidia_drm nvidia_modeset nvidia_uvm amdgpu radeon i915 xe nouveau xfs f2fs ocfs2 cifs lpfc qla2xxx "
